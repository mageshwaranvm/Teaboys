<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TeaRound</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#211b16;--muted:#756b63;--accent:#5c3b25;--line:#e7dfd6;--ok:#26734d;--danger:#a23b31}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:720px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:800;font-size:24px}.pill{padding:7px 11px;border-radius:999px;background:#e8f3ec;color:var(--ok);font-size:13px;font-weight:700}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 3px 16px #00000008}.hero h1{margin:0 0 5px;font-size:30px}.muted{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{display:flex;align-items:center;justify-content:space-between;padding:15px;border:1px solid var(--line);border-radius:16px}.item .name{font-weight:700}.controls{display:flex;align-items:center;gap:9px}.round{width:38px;height:38px;border-radius:12px;background:#f0ebe5;color:var(--ink);font-size:22px}.qty{min-width:24px;text-align:center;font-weight:800}.primary{width:100%;padding:14px 16px;border-radius:14px;background:var(--accent);color:white;font-weight:800;margin-top:12px}.secondary{padding:11px 14px;border-radius:12px;background:#efe9e2;color:var(--ink);font-weight:700}.danger{background:#f7e5e2;color:var(--danger)}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:13px;border-radius:14px;background:#f7f3ee}.stat b{display:block;font-size:22px}.hidden{display:none}.list{display:flex;flex-direction:column;gap:9px}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}label{display:block;font-weight:700;margin:12px 0 6px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:white}h2{margin:4px 0 12px;font-size:19px}.notice{padding:12px;border-radius:12px;background:#f4efe9;color:var(--muted);font-size:13px}.footer{color:var(--muted);font-size:12px;text-align:center;padding:18px}.tabs{display:flex;gap:8px;margin:10px 0}.tab{flex:1;padding:11px;border-radius:12px;background:#eee8e0;font-weight:700}.tab.active{background:var(--accent);color:white}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:14px}.hero h1{font-size:26px}}
</style></head>
<body><div class="wrap">
<div class="top"><div class="brand">🍵 TeaRound</div><div id="status" class="pill">New round</div></div>
<div id="setup" class="card">
<h2>Create a tea round</h2>
<label>Round name</label><input id="roundName" value="Morning Tea">
<label>Closing time</label><input id="closeTime" type="time" value="11:30">
<label>Expected people <span class="muted">(optional)</span></label><input id="people" type="number" min="1" value="10">
<button class="primary" onclick="startRound()">Start Round</button>
</div>
<div id="app" class="hidden">
<div class="card hero"><h1 id="title"></h1><div class="muted" id="meta"></div></div>
<div class="tabs"><button class="tab active" onclick="showTab('order',this)">Place order</button><button class="tab" onclick="showTab('count',this)">Live count</button></div>
<section id="order">
<div class="card"><h2>My order</h2><div class="grid" id="items"></div><button class="primary" onclick="submitOrder()">Confirm my order</button><div id="saved" class="notice hidden">Your order is saved. You can change it until the round is closed.</div></div>
</section>
<section id="count" class="hidden">
<div class="card"><h2>Live count</h2><div class="summary" id="summary"></div><div class="list" id="peopleList"></div><button class="primary" onclick="closeRound()">🔒 Close round</button></div>
<div class="card"><h2>Shop order</h2><div class="list" id="shop"></div><button class="secondary" onclick="copyShopOrder()">Copy shop order</button></div>
</section>
</div>
<div class="footer">TeaRound • Count the order, not the accounts.</div>
</div>
<script>
const menu=[['Tea','🫖'],['Coffee','☕'],['Samosa','🥟'],['Biscuit','🍪']];
let state=JSON.parse(localStorage.getItem('tearound')||'null');
let my={Tea:0,Coffee:0,Samosa:0,Biscuit:0};
function save(){localStorage.setItem('tearound',JSON.stringify(state))}
function startRound(){state={name:roundName.value||'Tea Round',close:closeTime.value,people:+people.value||0,closed:false,orders:[]};save();render()}
function render(){if(!state){setup.classList.remove('hidden');app.classList.add('hidden');return}setup.classList.add('hidden');app.classList.remove('hidden');title.textContent=state.name;meta.textContent=(state.people?state.people+' people expected • ':'')+'Closes '+state.close+(state.closed?' • 🔒 Closed':'');status.textContent=state.closed?'🔒 Closed':'🟢 Open';status.style.background=state.closed?'#f7e5e2':'#e8f3ec';status.style.color=state.closed?'#a23b31':'#26734d';buildItems();updateCounts()}
function buildItems(){items.innerHTML=menu.map(([n,e])=>`<div class="item"><div><div>${e} <span class="name">${n}</span></div></div><div class="controls"><button class="round" onclick="change('${n}',-1)">−</button><span class="qty" id="q-${n}">${my[n]}</span><button class="round" onclick="change('${n}',1)">+</button></div></div>`).join('')}
function change(n,d){if(state.closed)return;my[n]=Math.max(0,my[n]+d);document.getElementById('q-'+n).textContent=my[n]}
function submitOrder(){if(state.closed)return;state.orders=state.orders.filter(o=>o.id!=='me');state.orders.push({id:'me',name:'Me',items:{...my},at:Date.now()});save();saved.classList.remove('hidden');updateCounts();showTab('count',document.querySelectorAll('.tab')[1])}
function updateCounts(){if(!state)return;let totals=Object.fromEntries(menu.map(x=>[x[0],0]));state.orders.forEach(o=>menu.forEach(([n])=>totals[n]+=o.items[n]||0));summary.innerHTML=menu.map(([n,e])=>`<div class="stat"><span>${e} ${n}</span><b>${totals[n]}</b></div>`).join('');peopleList.innerHTML=`<div class="row"><span>People ordered</span><b>${state.orders.length}${state.people?' / '+state.people:''}</b></div>`;shop.innerHTML=menu.map(([n,e])=>`<div class="row"><span>${e} ${n}</span><b>${totals[n]}</b></div>`).join('')}
function closeRound(){state.closed=true;save();render();showTab('count',document.querySelectorAll('.tab')[1])}
function showTab(id,btn){document.getElementById('order').classList.toggle('hidden',id!=='order');document.getElementById('count').classList.toggle('hidden',id!=='count');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function copyShopOrder(){let rows=[...shop.querySelectorAll('.row')].map(x=>x.innerText.replace('\n',' — ')).join('\n');navigator.clipboard?.writeText(state.name+'\n'+rows);alert('Shop order copied')}
render();
</script></body></html>
