<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5c3b25">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Teaboys">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Teaboys</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#211b16;--muted:#756b63;--accent:#5c3b25;--line:#e7dfd6}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:0}.wrap{max-width:620px;margin:auto;padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:800;font-size:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 3px 16px #00000008}
h1{margin:0 0 6px;font-size:28px}h2{margin:4px 0 14px;font-size:20px}.muted{color:var(--muted);font-size:14px}
.primary{width:100%;padding:15px;border-radius:14px;background:var(--accent);color:white;font-weight:800;margin-top:10px}
.secondary{width:100%;padding:14px;border-radius:14px;background:#efe9e2;color:var(--ink);font-weight:800;margin-top:10px}
.home-btn{font-size:18px;padding:22px;text-align:left}.home-btn span{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{display:flex;align-items:center;justify-content:space-between;padding:14px;border:1px solid var(--line);border-radius:16px}.name{font-weight:700}.controls{display:flex;align-items:center;gap:8px}.round{width:40px;height:40px;border-radius:12px;background:#f0ebe5;font-size:22px}.qty{min-width:25px;text-align:center;font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.notice{padding:12px;border-radius:12px;background:#f4efe9;color:var(--muted);font-size:13px}.hidden{display:none}.total{font-size:22px;font-weight:800}
@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="brand">🍵 Teaboys</div></div>

<section id="home" class="card">
<h1>Teaboys</h1>
<div class="muted">Simple tea order taking</div>
<button id="newOrderHome" class="primary home-btn">＋ New order<span>Select quantities and place a new tea order.</span></button>
<button id="pastHome" class="secondary home-btn">🧾 Past orders<span>View the latest 10 tea orders.</span></button>
<button id="editMenuHome" class="secondary home-btn">✏️ Edit menu<span>Add or remove items. Changes sync to Supabase for everyone.</span></button>
</section>

<section id="menuPage" class="card hidden">
<h2>New order</h2>
<div class="notice">Use + and − to set the quantity for each item.</div>
<div id="items" class="grid" style="margin-top:12px"></div>
<button id="addItemOnOrderBtn" class="secondary">＋ Add menu item</button>
<div id="quickAddMenu" class="card hidden" style="margin:12px 0 0;padding:14px">
<input id="quickMenuName" type="text" maxlength="60" placeholder="Menu item name" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit">
<input id="quickMenuEmoji" type="text" maxlength="8" placeholder="Emoji (optional)" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;margin-top:8px">
<button id="quickAddMenuBtn" class="primary">＋ Add item</button>
<button id="cancelQuickAddBtn" class="secondary">Cancel</button>
</div>
<button id="placeBtn" class="primary">Place order</button>
<button id="backFromMenu" class="secondary">← Back</button>
</section>

<section id="totalPage" class="card hidden">
<h2>Order total</h2>
<div id="orderTotal"></div>
<button id="editBtn" class="primary">✏️ Edit order</button>
<button id="homeAfterOrder" class="secondary">Done</button>
</section>

<section id="menuEditPage" class="card hidden">
<h2>Edit menu</h2>
<div class="notice">Changes are saved to Supabase immediately, so the updated menu will appear when the app is opened on another device.</div>
<div id="menuEditor" style="margin-top:12px"></div>
<div class="card" style="margin:12px 0 0;padding:14px">
<input id="newMenuName" type="text" maxlength="60" placeholder="New item name" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit">
<input id="newMenuEmoji" type="text" maxlength="8" placeholder="Emoji (optional)" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;margin-top:8px">
<button id="addMenuBtn" class="primary">＋ Add item</button>
</div>
<button id="backFromMenuEdit" class="secondary">← Back</button>
</section>

<section id="pastPage" class="card hidden">
<h2>Past 10 orders</h2>
<div id="pastList"></div>
<button id="backFromPast" class="secondary">← Back</button>
</section>

<div class="muted" style="text-align:center;padding:18px 0;font-size:12px">Teaboys</div>
</div>

<script>
'use strict';
if ("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
const SUPABASE_URL='https://mfcpgogbnjwqacvopgns.supabase.co';
const SUPABASE_KEY='sb_publishable_3Pu9dG2QeiXYyHQXwXpb0A_XD48zoBS';
const $=id=>document.getElementById(id);
let menu=[], quantities={}, editingOrderId=null;

async function api(path,options={}){
 const res=await fetch(SUPABASE_URL+path,{...options,headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Prefer':options.prefer||'return=representation',...(options.headers||{})}});
 const text=await res.text();let data;try{data=text?JSON.parse(text):null}catch(e){data=text}
 if(!res.ok)throw new Error(data?.message||data?.error_description||data?.error||text||'Request failed');
 return data;
}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function show(page){
 ['home','menuPage','menuEditPage','totalPage','pastPage'].forEach(id=>$(id).classList.toggle('hidden',id!==page));
}
async function loadMenu(){
 try{
  const rows=await api('/rest/v1/menu_catalog?select=name,emoji,sort_order&order=sort_order.asc,name.asc');
  menu=rows||[];
  if(!menu.length)throw new Error('No menu items found in Supabase.');
 }catch(e){alert('Could not load menu: '+e.message)}
}
function renderMenuEditor(){
 $('menuEditor').innerHTML=menu.map(x=>'<div class="row"><span>'+esc(x.emoji||'🍽️')+' <b>'+esc(x.name)+'</b></span><button class="round" data-delete-menu="'+esc(x.name)+'" title="Remove item">🗑️</button></div>').join('');
}
async function openMenuEditor(){
 await loadMenu(); renderMenuEditor(); show('menuEditPage');
}
async function addMenuItem(){
 const name=$('newMenuName').value.trim();
 const emoji=$('newMenuEmoji').value.trim()||'🍽️';
 if(!name)return alert('Please enter an item name.');
 if(menu.some(x=>x.name.toLowerCase()===name.toLowerCase()))return alert('That item already exists.');
 try{
  const sort_order=menu.length?Math.max(...menu.map(x=>Number(x.sort_order)||0))+1:0;
  await api('/rest/v1/menu_catalog',{method:'POST',body:JSON.stringify({name,emoji,sort_order}),prefer:'return=representation'});
  $('newMenuName').value=''; $('newMenuEmoji').value='';
  await openMenuEditor();
 }catch(e){alert('Could not add menu item: '+e.message)}
}
async function quickAddMenuItem(){
 const name=$('quickMenuName').value.trim();
 const emoji=$('quickMenuEmoji').value.trim()||'🍽️';
 if(!name)return alert('Please enter an item name.');
 if(menu.some(x=>x.name.toLowerCase()===name.toLowerCase()))return alert('That item already exists.');
 try{
  const sort_order=menu.length?Math.max(...menu.map(x=>Number(x.sort_order)||0))+1:0;
  await api('/rest/v1/menu_catalog',{method:'POST',body:JSON.stringify({name,emoji,sort_order}),prefer:'return=representation'});
  $('quickMenuName').value=''; $('quickMenuEmoji').value='';
  $('quickAddMenu').classList.add('hidden');
  await loadMenu();
  if(editingOrderId){
   const old=quantities;
   quantities={};menu.forEach(x=>quantities[x.name]=old[x.name]||0);
  }else{
   resetQuantities();
  }
  renderMenu();
 }catch(e){alert('Could not add menu item: '+e.message)}
}
async function deleteMenuItem(name){
 if(!confirm('Remove "'+name+'" from the menu?'))return;
 try{
  await api('/rest/v1/menu_catalog?name=eq.'+encodeURIComponent(name),{method:'DELETE',prefer:'return=minimal'});
  await openMenuEditor();
 }catch(e){alert('Could not remove menu item: '+e.message)}
}
function resetQuantities(){
 quantities={};menu.forEach(x=>quantities[x.name]=0);
}
function renderMenu(){
 $('items').innerHTML=menu.map(x=>'<div class="item"><div>'+esc(x.emoji||'🍽️')+' <span class="name">'+esc(x.name)+'</span></div><div class="controls"><button class="round" data-item="'+esc(x.name)+'" data-d="-1">−</button><span class="qty" id="q-'+esc(x.name)+'">'+(quantities[x.name]||0)+'</span><button class="round" data-item="'+esc(x.name)+'" data-d="1">+</button></div></div>').join('');
}
function changeItem(name,delta){
 quantities[name]=Math.max(0,(quantities[name]||0)+delta);
 const el=$('q-'+name);if(el)el.textContent=quantities[name];
}
function selectedItems(){return Object.fromEntries(Object.entries(quantities).filter(([,q])=>q>0))}
function renderOrderTotal(){
 const selected=selectedItems();
 const rows=Object.entries(selected);
 if(!rows.length){$('orderTotal').innerHTML='<div class="notice">No items selected.</div>';return}
 const total=rows.reduce((s,[,q])=>s+q,0);
 $('orderTotal').innerHTML=rows.map(([name,q])=>'<div class="row"><span>'+esc(name)+'</span><b>'+q+'</b></div>').join('')+'<div class="row total"><span>Total items</span><span>'+total+'</span></div>';
}
async function placeOrder(){
 const items=selectedItems();
 if(!Object.keys(items).length)return alert('Please add at least one item.');
 $('placeBtn').disabled=true;
 try{
  let result;
  if(editingOrderId){
   result=await api('/rest/v1/tea_orders?id=eq.'+encodeURIComponent(editingOrderId),{method:'PATCH',body:JSON.stringify({items,updated_at:new Date().toISOString()}),prefer:'return=representation'});
  }else{
   result=await api('/rest/v1/tea_orders',{method:'POST',body:JSON.stringify({items}),prefer:'return=representation'});
   editingOrderId=result?.[0]?.id||null;
  }
  if(!editingOrderId && result?.[0]?.id)editingOrderId=result[0].id;
  renderOrderTotal();show('totalPage');
 }catch(e){alert('Could not save order: '+e.message)}
 finally{$('placeBtn').disabled=false}
}
async function loadPast(){
 $('pastList').innerHTML='<div class="notice">Loading…</div>';
 try{
  const rows=await api('/rest/v1/tea_orders?select=id,items,created_at,updated_at&order=created_at.desc&limit=10');
  if(!rows.length){$('pastList').innerHTML='<div class="notice">No past orders yet.</div>';return}
  $('pastList').innerHTML=rows.map((o,i)=>{
   const entries=Object.entries(o.items||{});const total=entries.reduce((s,[,q])=>s+Number(q||0),0);
   return '<div class="card" style="margin:10px 0;padding:14px"><b>Order '+(i+1)+'</b><div class="muted">'+new Date(o.created_at).toLocaleString()+'</div>'+entries.map(([n,q])=>'<div class="row"><span>'+esc(n)+'</span><b>'+q+'</b></div>').join('')+'<div class="row"><b>Total items</b><b>'+total+'</b></div></div>';
  }).join('');
 }catch(e){$('pastList').innerHTML='<div class="notice">Could not load past orders: '+esc(e.message)+'</div>'}
}

$('newOrderHome').onclick=async()=>{editingOrderId=null;await loadMenu();resetQuantities();renderMenu();show('menuPage')};
$('pastHome').onclick=async()=>{await loadPast();show('pastPage')};
$('editMenuHome').onclick=openMenuEditor;
$('addItemOnOrderBtn').onclick=()=>{$('quickAddMenu').classList.toggle('hidden');$('quickMenuName').focus()};
$('cancelQuickAddBtn').onclick=()=>{$('quickAddMenu').classList.add('hidden');$('quickMenuName').value='';$('quickMenuEmoji').value=''};
$('quickAddMenuBtn').onclick=quickAddMenuItem;
$('backFromMenuEdit').onclick=()=>show('home');
$('addMenuBtn').onclick=addMenuItem;
$('menuEditor').onclick=e=>{const b=e.target.closest('[data-delete-menu]');if(b)deleteMenuItem(b.dataset.deleteMenu)};
$('backFromMenu').onclick=()=>show('home');
$('backFromPast').onclick=()=>show('home');
$('homeAfterOrder').onclick=()=>{editingOrderId=null;show('home')};
$('editBtn').onclick=()=>{renderMenu();show('menuPage')};
$('placeBtn').onclick=placeOrder;
$('items').onclick=e=>{const b=e.target.closest('[data-item]');if(b)changeItem(b.dataset.item,Number(b.dataset.d))};
loadMenu();
</script>
</body>
</html>
